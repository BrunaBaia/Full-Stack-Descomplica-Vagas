<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- 🔵 LADO ESQUERDO -->
        <div class="left">
            <h1 class="logo">Descomplica Vagas</h1>

            <h2 class="titulo">
                <span class="destaque">Organize sua vida profissional</span><br>
                em um só lugar
            </h2>

            <p class="impacto">
                <b>Chega de perder prazos ou se confundir com processos seletivos.</b>
            </p>

            <div class="description">
                <b>Organize vagas, acompanhe processos seletivos e nunca perca um prazo importante.</b>
            </div>
        </div>

        <!-- ⚪ LADO DIREITO -->
        <div class="right">
            <div class="form-box">

                <h2>Login</h2>

                <form id="loginForm">

                    <input id="email" type="email" placeholder="E-mail" required />
                    <input id="senha" type="password" placeholder="Senha" required />

                    <button type="submit" class="login-btn">Entrar</button>
                </form>

                <p id="mensagem"></p>

                <p style="margin-top:10px;">
                    Não tem conta? <a href="cadastrar.html">Cadastrar</a>
                </p>

                <a href="recuperar.html" class="forgot-password">
                    Esqueci minha senha
                </a>

                <p class="footer">© 2026 Descomplica Vagas</p>

            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
